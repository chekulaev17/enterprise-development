name: Tests

on:
  push:
    branches:
      - main
      - lab-1

  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore FoodDelivery.slnx

      - name: Build project
        run: dotnet build FoodDelivery.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FoodDelivery.slnx --no-build --configuration Release --verbosity normal
